# Crypto copy-trading LIVE PRACTICE (pretend money, public data only, no keys).
# Every ~5 minutes: look for new trades by the 10 skilled traders (+5 bench), run the checks,
# manage pretend positions in 6 versions, write trade cards, save results back to this repo.
name: crypto-copytrading-live
on:
  schedule:
    - cron: "*/5 * * * *"      # GitHub may delay scheduled runs by a few minutes
  workflow_dispatch:
concurrency:
  group: crypto-copytrading-live
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Get Kronos (from our backup repo)
        uses: actions/checkout@v4
        with:
          repository: Gkoushik4/kronos-core
          path: kronos-core
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: .github/workflows/crypto-copytrading-live.yml
      - name: Install
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install numpy pandas requests einops huggingface_hub safetensors tqdm
      - name: Run one cycle
        env:
          L3_DATA: results/copytrading_live
          KRONOS_DIR: kronos-core/code
          KRONOS_WEIGHTS: kronos-core/weights
          HF_HUB_OFFLINE: "1"
        run: python src/copytrading/l3/l3_live.py once
      - name: Save results
        run: |
          git config user.name "crypto-copytrading-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/copytrading_live
          git diff --cached --quiet && exit 0
          git commit -q -m "Live copy-trading update $(date -u +'%Y-%m-%d %H:%M') UTC"
          for i in 1 2 3; do git pull -q --rebase origin main && git push -q origin main && break; sleep 5; done
