# CRYPTO & MEME SYSTEM — live practice (pretend money, public data only, no keys).
# Each run keeps working for ~4.5 minutes (meme prices checked every 30 s, Hyperliquid every 5 min), then saves results.
name: system-live
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
concurrency:
  group: system-live
  cancel-in-progress: false
permissions:
  contents: write
  actions: write        # lets each run start the next one (keeps it running non-stop)
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: .github/workflows/system-live.yml
      - run: pip install numpy pandas requests
      - name: Run the system (~4.5 min)
        run: python src/system/system.py loop 270
      - name: Save results
        run: |
          git config user.name "crypto-meme-system-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/system
          git diff --cached --quiet && exit 0
          git commit -q -m "System update $(date -u +'%Y-%m-%d %H:%M') UTC"
          for i in 1 2 3 4; do git pull -q --rebase origin main && git push -q origin main && break; sleep 7; done
      - name: Start the next run (non-stop practice; turn off in Actions → ⋯ → Disable workflow)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run system-live.yml --ref main
